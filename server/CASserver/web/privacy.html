<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>隐私说明 · 校园统一身份认证</title>
  <link rel="stylesheet" href="/cas/login.css">
</head>
<body>
  <main class="privacy-page">
    <section aria-labelledby="privacy-heading">
      <p class="eyebrow">校园统一身份认证</p>
      <h1 id="privacy-heading">隐私说明</h1>
      <h2>用于登录验证的信息</h2>
      <p>认证服务使用你的学号或工号和密码核对身份。服务保存学工号、账号状态和带盐的密码散列。会话、一次性服务票据和安全记录用于完成登录、限制反复尝试和排查故障。</p>
      <h2>校园应用收到的信息</h2>
      <p>认证成功后，服务会把一次性票据交给发起登录的应用。获准接入的应用校验票据后，可取得关联的校园身份信息，用于登录、绑定账号或核验校园资料。</p>
      <h2>如何管理</h2>
      <p>请在认证页面输入学工号密码。在公共设备上用完后，请退出校园应用和统一身份认证。需要更正学工号、重置认证密码或处理校园身份绑定时，请联系相应的站点管理员。</p>
      <a href="/cas">返回统一身份认证</a>
    </section>
  </main>
</body>
</html>
